<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>Shoply — каталог товаров</title>
    <meta
      name="description"
      content="Визуальные образцы каталога, страницы товара, корзины, оформления и подтверждения заказа Shoply."
    />
    <script>
      // Apply the saved/system theme before CSS and Vue mount.
      try {
        const saved = localStorage.getItem('shoply-theme');
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
          ? 'dark'
          : 'light';
      }
    </script>
    <script type="module" crossorigin src="/assets/build/store-DMlKNqSf.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/build/legacy-CxVRtNxl.js">
    <link rel="stylesheet" crossorigin href="/assets/build/store-dn0qQx4g.css">
  </head>
  <body>
    <div id="app"></div>
    <noscript>Для работы магазина включите JavaScript.</noscript>
  </body>
</html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shoply — админка</title><link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/admin.css"></head><body><header><a href="index.html" class="brand">Shoply<span>.</span></a><span>Управление магазином</span><a href="index.html">Открыть магазин ↗</a></header><main><p id="notice" role="status"></p><section id="login" class="auth" hidden><h1 id="login-title">Вход в админку</h1><p id="login-help">Введите логин и пароль администратора.</p><form id="login-form"><label>Логин<input name="username" autocomplete="username" required maxlength="80"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button disabled id="login-button">Войти</button></form></section><section id="dashboard" hidden><nav><button data-tab="settings">Оформление</button><button data-tab="products">Товары</button><button data-tab="orders">Заказы</button><button id="logout" class="plain">Выйти</button></nav><section id="settings" class="tab"><h1>Оформление</h1><form id="settings-form" class="panel"><label>Название магазина<input name="name" required maxlength="80"></label><div class="color-row"><label>Основной цвет<input name="accent" type="color"></label><label>Фон<input name="background" type="color"></label><label>Текст<input name="text" type="color"></label></div><label>Поддержка в Telegram<input name="telegram" type="url" placeholder="https://t.me/username"></label><label>Логотип (PNG, JPEG, WebP, до 6 МБ)<input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp"></label><input name="logo" type="hidden"><div id="logo-preview"></div><button type="button" id="clear-logo" class="plain">Использовать текстовый логотип</button><div class="actions"><button type="submit">Сохранить оформление</button></div></form></section><section id="products" class="tab" hidden><div class="title-row"><h1>Товары</h1><button id="new-product">Добавить товар</button></div><div class="product-admin"><div id="product-list" class="panel"></div><form id="product-form" class="panel" hidden><h2 id="product-form-title">Новый товар</h2><input name="id" type="hidden"><input name="photo" type="hidden" value="0"><label>Название<input name="name" required maxlength="160"></label><label>Категория<input name="category" required maxlength="100" list="category-list"></label><datalist id="category-list"></datalist><label>Цена, ₽<input name="price" type="number" min="0.01" max="100000000" step="0.01" required></label><label>Описание<textarea name="description" rows="5" maxlength="10000"></textarea></label><label class="checkbox"><input name="demo" type="checkbox">Демонстрационный товар</label><h3>Фотографии</h3><p class="muted">До 12 фотографий. Первая используется в каталоге. Для изменения порядка используйте стрелки.</p><input id="product-files" type="file" multiple accept="image/png,image/jpeg,image/webp"><div id="photos" class="photos"></div><h3>Произвольные свойства</h3><div id="properties"></div><button type="button" id="add-property" class="plain">+ Добавить свойство</button><div class="actions"><button type="submit">Сохранить товар</button><button type="button" id="delete-product" class="danger">Удалить товар</button></div></form></div></section><section id="orders" class="tab" hidden><div class="title-row"><h1>Заказы</h1><button id="refresh-orders" class="plain">Обновить</button></div><div id="order-list"></div></section></section><noscript><p>Для управления магазином включите JavaScript. Формы входа отключены.</p></noscript></main><script src="assets/js/admin.js"></script></body></html>

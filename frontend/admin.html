<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>Shoply — админка</title>
    <script>
      // Apply the saved/system theme before CSS and Vue mount.
      try {
        const saved = localStorage.getItem('shoply-theme');
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
          ? 'dark'
          : 'light';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Для работы магазина включите JavaScript.</noscript>
    <script
      type="module"
      src="/src/admin.ts"
    ></script>
  </body>
</html>

name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend and persistence
        run: python3 tests/test_shop.py
      - name: Frontend logic
        run: node tests/test_frontend.cjs
      - name: Admin logic
        run: node tests/test_admin.cjs
      - name: Theme logic
        run: node tests/test_theme.cjs
      - name: Public deployment runtime
        run: python3 tests/test_deployment.py
      - name: JavaScript syntax
        run: |
          for file in public/assets/js/*.js tests/*.cjs; do
            node --check "$file"
          done
      - name: Whitespace
        run: git diff --check
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build container
        run: docker build -t shoply-test .
      - name: Container recreation and persistence
        env:
          SHOPLY_TEST_IMAGE: shoply-test
        run: python3 tests/test_deployment.py
  deploy:
    needs: [test, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOKPLOY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Skip outdated revision
        id: revision
        shell: bash
        run: |
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit exists; its checks will handle deployment."
          fi
      - name: Request Dokploy deployment
        if: steps.revision.outputs.current == 'true'
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: python3 scripts/deploy_dokploy.py
